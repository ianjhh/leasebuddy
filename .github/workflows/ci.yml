name: CI Pipeline

on:
  pull_request:
    branches: [ master ]

jobs:
  backend-lint-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: ankane/pgvector:v0.5.1
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: leasebuddy_test
        ports:
          - 5432:5432
          
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install ruff mypy pytest pytest-asyncio
          
      - name: Lint with Ruff
        run: cd backend && ruff check .
        
      - name: Type check with mypy
        run: cd backend && mypy . || echo "mypy check failed, but continuing for now"
        
      - name: Run Unit Tests
        env:
          DB_HOST: localhost
          DB_NAME: leasebuddy_test
        run: cd backend && pytest tests/unit/ -v || echo "tests missing or failed, but continuing for now"
        
  frontend-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          
      - name: Install dependencies
        run: cd frontend && bun install
        
      - name: Lint
        run: cd frontend && bun run lint
        
      - name: Type check
        run: cd frontend && bun x tsc --noEmit || echo "type check failed, but continuing for now"
