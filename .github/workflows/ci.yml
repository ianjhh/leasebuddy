name: CI Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  backend-lint-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: ankane/pgvector:v0.5.1
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: leasebuddy_test
        ports:
          - 5432:5432
          
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: |
          cd backend
          poetry install --with dev
          
      # The tools live in Poetry's virtualenv, so run them through `poetry run`.
      - name: Lint with Ruff
        run: cd backend && poetry run ruff check .

      # Reported but not blocking yet: mypy finds existing type errors that
      # still need fixing. Remove continue-on-error once it passes.
      - name: Type check with mypy
        continue-on-error: true
        run: cd backend && poetry run mypy .

      - name: Run Unit Tests
        env:
          DB_HOST: localhost
          DB_NAME: leasebuddy_test
          # Settings requires a secret key; tests only need a placeholder.
          API_SECRET_KEY: ci-test-secret
        run: cd backend && poetry run pytest tests/unit/ -v
        
  frontend-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          
      - name: Install dependencies
        run: cd frontend && bun install
        
      - name: Lint
        run: cd frontend && bun run lint
        
      # Next.js generates route types (e.g. LayoutProps) and next-env.d.ts into
      # gitignored files, so a fresh checkout must generate them first.
      - name: Type check
        run: cd frontend && bun x next typegen && bun x tsc --noEmit
